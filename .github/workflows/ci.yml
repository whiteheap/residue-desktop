name: ci

# The Mac app's checks on macOS: type-check, lint, the web build (with
# bundle.ts's checks) and the Rust format. Clippy and the universal build
# need the bundled residue in src-tauri/binaries, which comes from a pinned
# residue-cli release in the next change; they join this job then.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    # The ruleset on main requires a check named macos-latest.
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build the web assets
        run: pnpm build
      # rust-toolchain.toml pins the version, rustfmt, clippy and both macOS
      # targets.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
