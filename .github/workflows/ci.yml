name: ci

# The Mac app's checks on macOS: the residue-cli release that sidecar.lock
# pins, type-check, lint, the web build (with bundle.ts's checks), the Rust
# format and clippy, a universal build, and scripts/check-app.sh on the
# bundle. The DMG is kept as the run's artifact; nothing is published.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    # The ruleset on main requires a check named macos-latest.
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release's two macOS archives, each checked against sidecar.lock's
      # sha256 and its build-provenance attestation, then joined with lipo
      # where Tauri's externalBin expects them. Clippy needs them too.
      - name: Place the bundled residue
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/sidecar.sh --require-attestation
      # rust-toolchain.toml pins the version, rustfmt, clippy and both macOS
      # targets.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build the web assets
        run: pnpm build
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build the app (universal, ad-hoc signed)
        run: pnpm tauri build --ci --target universal-apple-darwin -- --locked
      - name: Check the bundle
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          sh scripts/check-app.sh "$bundle/macos/residue.app"
          set -- "$bundle"/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one DMG from the build, found: $*"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app"
          cp "$1" "$RUNNER_TEMP/app/residue-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: residue-macos-dmg
          path: ${{ runner.temp }}/app/residue-macos.dmg
          if-no-files-found: error
