name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  attestations: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version, clippy, rustfmt and both macOS targets.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The pinned residue release: checksum against sidecar.lock and SHA256SUMS,
      # and its build-provenance attestation from whiteheap/residue.
      - name: Fetch and verify the residue sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/fetch-sidecar.sh
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build the web assets
        run: pnpm build
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the app (universal, ad-hoc signed)
        run: pnpm tauri build --ci --target universal-apple-darwin
      - name: Check the bundle
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/residue.app"
          lipo -archs "$app/Contents/MacOS/residue-desktop"
          lipo -archs "$app/Contents/MacOS/residue"
          "$app/Contents/MacOS/residue" --version | grep -qx "residue $(sed -n 's/^version=//p' sidecar.lock)"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/residue.app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: residue-desktop-macos-universal
          path: |
            ${{ runner.temp }}/residue.app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
