name: release

# Builds the universal macOS app, checks its ad-hoc signature, packages it as
# Residue-macos-universal.dmg and attests its build provenance.
#
# - A v* tag pushed from main publishes a GitHub release with the DMG and
#   SHA256SUMS. The asset name never changes, so
#   https://github.com/whiteheap/residue-desktop/releases/latest/download/Residue-macos-universal.dmg
#   always serves the newest release.
# - A manual run (workflow_dispatch, any branch) and a pull request that
#   changes this file are dry runs: they build, check and attest, keep the DMG
#   as an artifact, and publish nothing. GitHub starts a manual run only for a
#   workflow that is on main, so the pull request run proves a change first.
#   A pull request from a fork gets no id-token, so its attest job fails.
#
# README.md, "Release", has the steps.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSET: Residue-macos-universal.dmg

jobs:
  # Runs the build's third-party code (npm packages, crate build scripts), so it
  # holds no token that can write or sign anything.
  build:
    name: build (macos universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check that a tag points into main.
          fetch-depth: 0
      - name: Check the version
        run: |
          app=$(plutil -extract version raw -o - src-tauri/tauri.conf.json)
          npm=$(plutil -extract version raw -o - package.json)
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json $app, package.json $npm, src-tauri/Cargo.toml $crate"
          if [ -z "$app" ] || [ "$app" != "$npm" ] || [ "$app" != "$crate" ]; then
            echo "::error::The three version fields differ. Set the same version in each."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "v$app" != "$GITHUB_REF_NAME" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the version $app."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The tag $GITHUB_REF_NAME points to a commit that is not on main."
              exit 1
            fi
          fi
      # rust-toolchain.toml pins the version, clippy, rustfmt and both macOS targets.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      # No dependency caches: a release builds from the lockfiles alone.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      # The pinned residue release: checksum against sidecar.lock and SHA256SUMS,
      # and its build-provenance attestation from whiteheap/residue.
      - name: Fetch and verify the residue sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/fetch-sidecar.sh
      # tauri.conf.json sets signingIdentity "-": Tauri signs the sidecar, the
      # app binary and the bundle ad hoc. An unsigned arm64 binary does not run.
      - name: Build the app (universal, ad-hoc signed)
        run: pnpm tauri build --ci --target universal-apple-darwin -- --locked
      - name: Package the DMG
        run: |
          set -- src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one DMG from the build, found: $*"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "$1" "$RUNNER_TEMP/release/$ASSET"
          ls -l "$RUNNER_TEMP/release"
      # Checks what users download: the app inside the DMG, mounted read-only.
      - name: Check the app inside the DMG
        run: |
          dmg="$RUNNER_TEMP/release/$ASSET"
          mnt="$RUNNER_TEMP/dmg"
          hdiutil verify "$dmg"
          mkdir -p "$mnt"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg"
          # A residue child of the launch check below can still hold the volume.
          trap 'hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          app="$mnt/residue.app"
          ls -la "$mnt"
          test "$(lipo -archs "$app/Contents/MacOS/residue-desktop")" = "x86_64 arm64"
          test "$(lipo -archs "$app/Contents/MacOS/residue")" = "x86_64 arm64"
          "$app/Contents/MacOS/residue" --version | grep -qx "residue $(sed -n 's/^version=//p' sidecar.lock)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/residue"
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -qx 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"
          # The app starts from the volume and is still running a few seconds
          # later: a signature or library problem kills it at launch.
          "$app/Contents/MacOS/residue-desktop" &
          pid=$!
          sleep 10
          if ! kill -0 "$pid"; then
            wait "$pid" || echo "::error::The app exited at launch with status $?."
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Residue-macos-universal
          path: ${{ runner.temp }}/release/${{ env.ASSET }}
          if-no-files-found: error

  # Attests the DMG the build uploaded, on a fresh runner that runs no
  # third-party build code. A dry run attests too: its attestation names a
  # branch or pull request, never a tag, so `--source-ref refs/tags/...`
  # does not accept it.
  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Residue-macos-universal
          path: release
      - name: Checksums
        working-directory: release
        run: |
          sha256sum "$ASSET" > SHA256SUMS
          cat SHA256SUMS
          {
            echo "### $ASSET"
            echo
            echo "| Size | SHA-256 |"
            echo "| --- | --- |"
            echo "| $(stat -c %s "$ASSET") bytes | \`$(cut -d' ' -f1 SHA256SUMS)\` |"
            echo
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "The publish job releases it as $GITHUB_REF_NAME."
            else
              echo "Dry run: nothing is published. The DMG is this run's Residue-macos-universal artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/${{ env.ASSET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS
          if-no-files-found: error

  # Only a tag push gets here, and only this job can write to the repository.
  publish:
    needs: attest
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Check the DMG against the attested checksum
        working-directory: release
        run: sha256sum -c SHA256SUMS
      # A tag with a hyphen (v1.2.0-rc.1) is a prerelease, which never becomes
      # the latest release that the fixed download link serves.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          # The notes' verify command names this tag in place of vX.Y.Z.
          notes=$(sed "s/vX\.Y\.Z/$GITHUB_REF_NAME/g" .github/release-notes.md)
          gh release create "$GITHUB_REF_NAME" "release/$ASSET" release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "$kind" \
            --title "residue desktop $GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes
