name: release

# A v* tag builds the Mac app, residue-macos.dmg, with the residue-cli release
# that sidecar.lock pins inside it, and publishes it with SHA256SUMS and a
# build-provenance attestation. The DMG has the same name in every release,
# so https://github.com/whiteheap/residue-ui/releases/latest/download/residue-macos.dmg
# always serves the newest one.
#
# A pull request that changes this file, scripts/, sidecar.lock or
# src-tauri/tauri.conf.json, and a manual run (gh workflow run release.yml
# --ref BRANCH), are dry runs: they build and check everything for the
# version in tauri.conf.json and keep the DMG, SHA256SUMS and the notes as the
# run's artifacts. They attest nothing and publish nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "sidecar.lock"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # It runs the app build's third-party code (npm packages, crate build
  # scripts), so it holds no token that can write or sign anything, and it
  # uses no dependency cache.
  app:
    name: residue-macos.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release is of a commit on main, which reached it through a pull
      # request and the required check, and its tag matches the version.
      - name: Check the tag matches tauri.conf.json and is on main
        run: |
          version=$(plutil -extract version raw -o - src-tauri/tauri.conf.json)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME, and src-tauri/tauri.conf.json says $version."
              exit 1
            fi
            git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::$GITHUB_REF_NAME is at $GITHUB_SHA, which is not on main."
              exit 1
            fi
          fi
          echo "App version $version"
      # The two macOS archives of the residue-cli release that sidecar.lock
      # pins, each checked against its sha256 and its build-provenance
      # attestation, then joined with lipo. Only this step gets the token,
      # which can only read, and it runs before any third-party code.
      - name: Place the bundled residue
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/sidecar.sh --require-attestation
      # rust-toolchain.toml pins the version, rustfmt, clippy and both macOS
      # targets.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      # No dependency cache, each input written out: pnpm/action-setup's
      # cache, setup-node's cache and its automatic package-manager cache.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      # Signing. tauri.conf.json sets signingIdentity "-", so Tauri signs the
      # bundled residue, the app and the bundle ad hoc (an unsigned arm64
      # binary does not run), and the app is not notarized: the README's
      # "Install" section has the first-launch steps this needs.
      # With a Developer ID, sign and notarize in a separate job that takes
      # the built app, since this one runs third-party build code: codesign
      # and notarytool with APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY and an App Store Connect API key, from a
      # protected environment that only v* tags can use. Then change the
      # "adhoc" check in scripts/check-app.sh and the README's first-launch
      # steps.
      - name: Build the app (universal, ad-hoc signed)
        run: pnpm tauri build --ci --target universal-apple-darwin -- --locked
      - name: Package the DMG
        run: |
          set -- src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one DMG from the build, found: $*"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "$1" "$RUNNER_TEMP/release/residue-macos.dmg"
          ls -l "$RUNNER_TEMP/release"
      # What users download: the app inside the DMG, mounted read-only.
      # scripts/check-app.sh fails unless its residue-cli is the release
      # sidecar.lock pins, by its version, the attestation check and each
      # architecture's UUID.
      - name: Check the app inside the DMG
        run: |
          dmg="$RUNNER_TEMP/release/residue-macos.dmg"
          mnt="$RUNNER_TEMP/dmg"
          hdiutil verify "$dmg"
          mkdir -p "$mnt"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg"
          # A residue child of the launch below can still hold the volume.
          trap 'hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          ls -la "$mnt"
          app="$mnt/residue.app"
          sh scripts/check-app.sh "$app"
          # The app starts from the volume and is still running 10 seconds
          # later: a signature or library problem kills it at launch. A
          # scratch HOME keeps it from scanning the runner's folders.
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          HOME="$home" CFFIXED_USER_HOME="$home" "$app/Contents/MacOS/residue" &
          pid=$!
          sleep 10
          if ! kill -0 "$pid"; then
            wait "$pid" || echo "::error::The app exited at launch with status $?."
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
          echo "The app was still running 10 s after launch."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: residue-macos.dmg
          path: ${{ runner.temp }}/release/residue-macos.dmg
          if-no-files-found: error

  # SHA256SUMS and the notes, with read-only permissions, on every run. A dry
  # run ends here; its summary lists what a release would publish.
  checksums:
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: residue-macos.dmg
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum residue-macos.dmg > SHA256SUMS
          cat SHA256SUMS
      # A release's notes are its version's section of CHANGELOG.md, then the
      # residue-cli release inside, the first launch and how to verify. A dry
      # run takes ## Unreleased when the version has no section yet.
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          cli=$(sed -n 's/^version=//p' sidecar.lock)
          section() {
            awk -v h="$1" '
              $0 ~ "^## " h "( |$)" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md
          }
          section "$version" > dist/notes.md
          if [ ! -s dist/notes.md ] && [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "CHANGELOG.md has no section for $version yet; this dry run takes Unreleased."
            section Unreleased > dist/notes.md
          fi
          if [ ! -s dist/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          sed -e "s/@CLI@/$cli/" -e "s/@TAG@/v$version/g" >> dist/notes.md <<'EOF'

          **Inside:** residue-cli @CLI@, the release `sidecar.lock` pins, checked by its sha256 and its build-provenance attestation.

          **Install:** `residue-macos.dmg` is the app for macOS 13 or later, on Apple silicon and Intel. It is not notarized yet, so macOS blocks it the first time: the [README](https://github.com/whiteheap/residue-ui#install) has the steps to open it.

          **Verify:** `gh attestation verify residue-macos.dmg --repo whiteheap/residue-ui --deny-self-hosted-runners --cert-identity https://github.com/whiteheap/residue-ui/.github/workflows/release.yml@refs/tags/@TAG@`, which accepts only this workflow at this release's tag, or `shasum -a 256 -c SHA256SUMS`.
          EOF
          cat dist/notes.md
      - name: Summary
        run: |
          {
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "The publish job releases these as $GITHUB_REF_NAME:"
            else
              echo "Dry run: nothing is attested or published. A release would publish:"
            fi
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Notes:"
            echo
            cat dist/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/SHA256SUMS
            dist/notes.md
          if-no-files-found: error

  # Only a tag push gets here, and only this job can write to the repository
  # or sign: it runs no third-party code.
  publish:
    needs: checksums
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Each artifact by name, so only the DMG and the checksums job's files
      # reach the release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: residue-macos.dmg
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Check the DMG against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      # The subject is exactly what SHA256SUMS lists: the DMG.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/residue-macos.dmg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "residue-ui $GITHUB_REF_NAME" --notes-file dist/notes.md
