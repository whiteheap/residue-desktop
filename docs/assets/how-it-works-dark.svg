    <text x="36" y="684.6" font-size="17" font-weight="500" fill="#f5f5f5">What it changes, when you ask</text>
    <rect x="36.5" y="700.5" width="407" height="242" rx="6" fill="#131313" stroke="#303030"/>
    <text x="46" y="727.5" font-size="15" font-weight="500" fill="#f5f5f5">Move to the trash</text>
    <text x="46" y="747.1" font-size="14" fill="#8a8a8a">1</text><text x="62" y="747.1" font-size="14" fill="#a4a4a4">you select worktrees that can go</text>
    <text x="46" y="766.1" font-size="14" fill="#8a8a8a">2</text><text x="62" y="766.1" font-size="14" fill="#a4a4a4"><tspan fill="#f5f5f5">remove --trash --json PATHS</tspan>, the plan:</text>
    <text x="62" y="785.1" font-size="14" fill="#a4a4a4">without <tspan fill="#f5f5f5">--yes</tspan> it moves and purges nothing</text>
    <text x="46" y="804.1" font-size="14" fill="#8a8a8a">3</text><text x="62" y="804.1" font-size="14" fill="#a4a4a4">you click <tspan fill="#f5f5f5">Move N worktrees to the trash</tspan></text>
    <text x="46" y="823.1" font-size="14" fill="#8a8a8a">4</text><text x="62" y="823.1" font-size="14" fill="#a4a4a4">the same, with <tspan fill="#f5f5f5">--yes</tspan>, exactly the planned</text>
    <text x="62" y="842.1" font-size="14" fill="#a4a4a4">paths and <tspan fill="#f5f5f5">--as-of</tspan> the plan's time: residue</text>
    <text x="62" y="861.1" font-size="14" fill="#a4a4a4">checks each again, keeps any that changed</text>
    <text x="46" y="888.1" font-size="14" fill="#a4a4a4">The plan lists the worktrees it moves and</text>
    <text x="46" y="907.1" font-size="14" fill="#a4a4a4">keeps, the trash entries over 7 days old it</text>
    <text x="46" y="926.1" font-size="14" fill="#a4a4a4">purges, and the removal records it forgets.</text>
    <rect x="36.5" y="954.5" width="407" height="82" rx="6" fill="#131313" stroke="#303030"/>
    <text x="46" y="981.5" font-size="15" font-weight="500" fill="#f5f5f5">Restore</text>
    <text x="46" y="1001.1" font-size="14" fill="#a4a4a4">you click <tspan fill="#f5f5f5">Restore</tspan>: <tspan fill="#f5f5f5">restore --json ENTRY</tspan>,</text>
    <text x="46" y="1020.1" font-size="14" fill="#a4a4a4">for one trash entry or removal record</text>
    <rect x="36.5" y="1048.5" width="407" height="242" rx="6" fill="#131313" stroke="#303030"/>
    <text x="46" y="1075.5" font-size="15" font-weight="500" fill="#f5f5f5">Automatic cleanup</text>
    <text x="46" y="1095.1" font-size="14" fill="#a4a4a4"><tspan fill="#f5f5f5">service install FOLDERS</tspan>, or <tspan fill="#f5f5f5">uninstall</tspan>:</text>
    <text x="46" y="1114.1" font-size="14" fill="#a4a4a4">the launchd agent that runs <tspan fill="#f5f5f5">residue watch</tspan>.</text>
    <text x="46" y="1133.1" font-size="14" fill="#a4a4a4">On its own, watch removes one that can go:</text>
    <rect x="46.5" y="1144.5" width="6" height="6" fill="none" stroke="#a4a4a4"/><text x="60" y="1152.1" font-size="14" fill="#a4a4a4">work landed: its upstream branch is gone,</text>
    <text x="60" y="1171.1" font-size="14" fill="#a4a4a4">unchanged for <tspan fill="#f5f5f5">--grace</tspan> (1h)</text>
    <rect x="46.5" y="1182.5" width="6" height="6" fill="none" stroke="#a4a4a4"/><text x="60" y="1190.1" font-size="14" fill="#a4a4a4">disk low: free space under <tspan fill="#f5f5f5">--min-free</tspan> (10%);</text>
    <text x="60" y="1209.1" font-size="14" fill="#a4a4a4">unchanged for <tspan fill="#f5f5f5">--idle</tspan> (2d), largest first</text>
    <text x="46" y="1228.1" font-size="14" fill="#f5f5f5">It deletes instead of using the trash.</text>
    <text x="46" y="1255.1" font-size="14" fill="#a4a4a4">A save reads the service again: if it</text>
