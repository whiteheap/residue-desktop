    <text x="34" y="1365.5" font-size="15" font-weight="500" fill="#f5f5f5">Trash entry</text>
    <text x="34" y="1388.5" font-size="15" font-weight="500" fill="#f5f5f5">at least 7 days</text>
    <text x="34" y="1408.1" font-size="14" fill="#f5f5f5">--keep-trash</text>
    <text x="34" y="1435.1" font-size="14" fill="#a4a4a4">from Move to the</text>
    <text x="34" y="1454.1" font-size="14" fill="#a4a4a4">trash. Restore puts</text>
    <text x="34" y="1473.1" font-size="14" fill="#a4a4a4">it back whole. It</text>
