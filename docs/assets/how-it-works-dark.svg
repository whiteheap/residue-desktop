    <text x="268" y="1473.1" font-size="14" fill="#a4a4a4">Restore recreates it</text>
    <text x="268" y="1492.1" font-size="14" fill="#a4a4a4">at its path and HEAD;</text>
    <text x="268" y="1511.1" font-size="14" fill="#a4a4a4">its ignored files do</text>
    <text x="268" y="1530.1" font-size="14" fill="#a4a4a4">not come back</text>
    <path d="M226 1525.5H246" stroke="#6e6e6e" stroke-width="1.5" fill="none"/><path d="M245 1520.5L253 1525.5L245 1530.5Z" fill="#6e6e6e"/>
    <!-- 5. What it never touches -->
    <rect x="20.5" y="1571.5" width="439" height="212" rx="8" fill="#0a0a0a" stroke="#2e2e2e"/>
    <text x="36" y="1601.6" font-size="17" font-weight="500" fill="#f5f5f5">What it never touches</text>
    <text x="36" y="1625.5" font-size="15" fill="#a4a4a4"><tspan fill="#f5f5f5">Branches, commits and stashes:</tspan> residue</text>
    <text x="36" y="1646.5" font-size="15" fill="#a4a4a4">never deletes one.</text>
    <text x="36" y="1674.5" font-size="15" fill="#f5f5f5">A worktree that is kept, unknown or stale:</text>
