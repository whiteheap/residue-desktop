    <!-- 5. What it never touches -->
    <rect x="20.5" y="1571.5" width="439" height="275" rx="8" fill="#ffffff" stroke="#dedede"/>
    <text x="36" y="1601.6" font-size="17" font-weight="500" fill="#0a0a0a">What it never touches</text>
    <text x="36" y="1625.5" font-size="15" fill="#4f4f4f"><tspan fill="#0a0a0a">Branches, commits and stashes:</tspan> removing a</text>
