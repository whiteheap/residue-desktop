    <rect x="46.5" y="1182.5" width="6" height="6" fill="none" stroke="#4f4f4f"/><text x="60" y="1190.1" font-size="14" fill="#4f4f4f">disk low: free space under <tspan fill="#0a0a0a">--min-free</tspan> (10%);</text>
    <text x="60" y="1209.1" font-size="14" fill="#4f4f4f">unchanged for <tspan fill="#0a0a0a">--idle</tspan> (2d), largest first</text>
    <text x="46" y="1228.1" font-size="14" fill="#0a0a0a">It deletes instead of using the trash.</text>
    <text x="46" y="1255.1" font-size="14" fill="#4f4f4f">A save reads the service and its folders</text>
