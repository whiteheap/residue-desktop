    <text x="36" y="684.6" font-size="17" font-weight="500" fill="#0a0a0a">What it changes, when you ask</text>
    <rect x="36.5" y="700.5" width="407" height="242" rx="6" fill="#f6f6f6" stroke="#e2e2e2"/>
    <text x="46" y="727.5" font-size="15" font-weight="500" fill="#0a0a0a">Move to the trash</text>
    <text x="46" y="747.1" font-size="14" fill="#6b6b6b">1</text><text x="62" y="747.1" font-size="14" fill="#4f4f4f">you select worktrees that can go</text>
    <text x="46" y="766.1" font-size="14" fill="#6b6b6b">2</text><text x="62" y="766.1" font-size="14" fill="#4f4f4f"><tspan fill="#0a0a0a">remove --trash --json PATHS</tspan>, the plan:</text>
    <text x="62" y="785.1" font-size="14" fill="#4f4f4f">without <tspan fill="#0a0a0a">--yes</tspan> it moves and purges nothing</text>
    <text x="46" y="804.1" font-size="14" fill="#6b6b6b">3</text><text x="62" y="804.1" font-size="14" fill="#4f4f4f">you click <tspan fill="#0a0a0a">Move N worktrees to the trash</tspan></text>
    <text x="46" y="823.1" font-size="14" fill="#6b6b6b">4</text><text x="62" y="823.1" font-size="14" fill="#4f4f4f">the app plans again, leaves out any that</text>
    <text x="62" y="842.1" font-size="14" fill="#4f4f4f">changed, then runs the same with <tspan fill="#0a0a0a">--yes</tspan></text>
    <text x="62" y="861.1" font-size="14" fill="#4f4f4f">and <tspan fill="#0a0a0a">--as-of</tspan> the plan's time</text>
    <text x="46" y="888.1" font-size="14" fill="#4f4f4f">The plan lists the worktrees it moves and</text>
    <text x="46" y="907.1" font-size="14" fill="#4f4f4f">keeps, and each trash entry over 7 days old</text>
    <text x="46" y="926.1" font-size="14" fill="#4f4f4f">and removal record it may purge or forget.</text>
    <rect x="36.5" y="954.5" width="407" height="82" rx="6" fill="#f6f6f6" stroke="#e2e2e2"/>
    <text x="46" y="981.5" font-size="15" font-weight="500" fill="#0a0a0a">Restore</text>
    <text x="46" y="1001.1" font-size="14" fill="#4f4f4f">you click <tspan fill="#0a0a0a">Restore</tspan>: <tspan fill="#0a0a0a">restore --json ENTRY</tspan>,</text>
    <text x="46" y="1020.1" font-size="14" fill="#4f4f4f">for the one entry its row listed</text>
    <rect x="36.5" y="1048.5" width="407" height="242" rx="6" fill="#f6f6f6" stroke="#e2e2e2"/>
    <text x="46" y="1075.5" font-size="15" font-weight="500" fill="#0a0a0a">Automatic cleanup</text>
    <text x="46" y="1095.1" font-size="14" fill="#4f4f4f"><tspan fill="#0a0a0a">service install FOLDERS</tspan>, or <tspan fill="#0a0a0a">uninstall</tspan>:</text>
    <text x="46" y="1114.1" font-size="14" fill="#4f4f4f">the launchd agent that runs <tspan fill="#0a0a0a">residue watch</tspan>.</text>
    <text x="46" y="1133.1" font-size="14" fill="#4f4f4f">On its own, watch removes one that can go:</text>
    <rect x="46.5" y="1144.5" width="6" height="6" fill="none" stroke="#4f4f4f"/><text x="60" y="1152.1" font-size="14" fill="#4f4f4f">work landed: its upstream branch is gone,</text>
