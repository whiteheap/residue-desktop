# The Mac app's own crate. It is not part of the residue CLI's package: the
# root Cargo.toml excludes app/, and the [workspace] table below keeps this
# crate its own workspace, so nothing at the root builds or reads it.
#
# No version here: the app's version is the CLI's, from the root Cargo.toml,
# and scripts/tauri.sh passes it to `tauri dev` and `tauri build`.
[package]
name = "residue-app"
description = "The residue Mac app: see and reclaim the storage Git worktrees take"
authors = ["Whiteheap"]
license = "MIT"
repository = "https://github.com/whiteheap/residue"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[lib]
name = "residue_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is residue: macOS shows its name in the menu bar, the Dock,
# Cmd-Tab, Activity Monitor and crash reports, and a `tauri dev` run has no
# bundle to name it otherwise. The package keeps its own name, so
# `cargo install --git … residue` still picks the CLI, the package named
# residue. The bundled CLI is residue-cli beside it (tauri.conf.json).
[[bin]]
name = "residue"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"

# Only the debug-build snapshot hook (src/devshot.rs) calls these. Tauri's
# WebKit backend already depends on the same versions.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
