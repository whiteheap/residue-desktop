# The Mac app's crate. The [workspace] table below makes it a workspace of
# its own, so cargo never takes a Cargo.toml in a parent folder for one.
#
# No version here: the app's version is the one in tauri.conf.json.
[package]
name = "residue-app"
description = "The residue Mac app: see and reclaim the storage Git worktrees take"
authors = ["Whiteheap"]
license = "MIT"
repository = "https://github.com/whiteheap/residue-ui"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[lib]
name = "residue_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is residue: macOS shows its name in the menu bar, the Dock,
# Cmd-Tab, Activity Monitor and crash reports, and a `tauri dev` run has no
# bundle to name it otherwise. The bundled CLI is residue-cli beside it
# (tauri.conf.json).
[[bin]]
name = "residue"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"

# Only the debug-build snapshot hook (src/devshot.rs) calls these. Tauri's
# WebKit backend already depends on the same versions.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
