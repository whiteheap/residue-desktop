# The app's own clippy settings. Without this file Clippy reads the CLI's
# clippy.toml at the repository root, whose rule names the CLI's run::spawn.
#
# A child starts only through cli::spawn, which holds the lock that keeps a
# child from inheriting another child's pipes on macOS (#116).
disallowed-methods = [
    { path = "std::process::Command::spawn", reason = "start a child with cli::spawn (#116)" },
    { path = "std::process::Command::output", reason = "start a child with cli::Run or cli::spawn (#116)" },
    { path = "std::process::Command::status", reason = "start a child with cli::Run or cli::spawn (#116)" },
]
