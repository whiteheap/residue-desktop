# A child starts only through cli::spawn, which holds the lock that keeps a
# child from inheriting another child's pipes on macOS (residue-cli#116).
disallowed-methods = [
    { path = "std::process::Command::spawn", reason = "start a child with cli::spawn (residue-cli#116)" },
    { path = "std::process::Command::output", reason = "start a child with cli::Run or cli::spawn (residue-cli#116)" },
    { path = "std::process::Command::status", reason = "start a child with cli::Run or cli::spawn (residue-cli#116)" },
]
